# Production topology — one EC2 instance in ap-south-1, x86, Ubuntu 24.04.
#
# No `platform:` pin on the base images; they are multi-arch. The app image is
# not built here. A Mac builds it for linux/amd64 and pushes it to GHCR, and
# this 2 GB t3.small only pulls JTAS_IMAGE. The backup image is still built
# on the box. See docs/DEPLOY.md.
#
#   caddy   the only thing on the public internet; terminates TLS for
#           <dashed-elastic-ip>.sslip.io
#   app     the Next server, reachable only from caddy
#   worker  the scheduler; reachable from nothing
#   db      PostgreSQL 16
#   redis   BullMQ's broker and the shared rate-limit store
#   minio   attachment storage, internal only
#   backup  nightly pg_dump to S3, using the instance role, 30-day retention
#
# Only caddy publishes ports. Postgres, Redis and MinIO stay on the docker
# network. Do not add them to the security group or to ufw.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Configuration comes from the server's .env — see docs/DEPLOY.md.
# That file is not the laptop development .env.
#
# No explicit container_name anywhere: the project name below already prefixes
# every container, and hard-coding them collides with the development stack the
# moment both exist on one machine — which is exactly what happens when
# somebody tests the production compose on their laptop.

name: jtas-prod

x-app-env: &app-env
  NODE_ENV: production
  TZ: UTC
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10&pool_timeout=20
  REDIS_URL: redis://redis:6379
  APP_BASE_URL: https://${JTAS_DOMAIN}
  JWT_SECRET: ${JWT_SECRET}
  REFRESH_SECRET: ${REFRESH_SECRET}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-JTAS}
  MAIL_PROVIDER: ${MAIL_PROVIDER:-brevo}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MAIL_ALLOWLIST: ${MAIL_ALLOWLIST:-}
  MAIL_DAILY_CAP: ${MAIL_DAILY_CAP:-250}
  # Two endpoints. The app talks to MinIO on the Docker network; the browser
  # reaches it through Caddy at /files. SigV4 signs the host, so a presigned
  # URL must be signed against the public one — and the server should not have
  # to route its own reads back out through the public name.
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${JTAS_FILES_DOMAIN}}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_BUCKET: ${S3_BUCKET:-jtas-attachments}
  S3_KEY: ${MINIO_ROOT_USER}
  S3_SECRET: ${MINIO_ROOT_PASSWORD}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-5}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80' # the ACME challenge arrives here
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      JTAS_DOMAIN: ${JTAS_DOMAIN}
      JTAS_FILES_DOMAIN: ${JTAS_FILES_DOMAIN:-files.${JTAS_DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - jtas-caddy-data:/data # the certificates; losing this re-issues them
      - jtas-caddy-config:/config
      - jtas-caddy-logs:/var/log/caddy
    depends_on:
      - app

  app:
    image: ${JTAS_IMAGE}
    restart: unless-stopped
    environment: *app-env
    # No `ports`: the app is reachable only through caddy.
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${JTAS_IMAGE}
    restart: unless-stopped
    environment: *app-env
    command: ['node_modules/.bin/tsx', '--tsconfig', 'tsconfig.worker.json', 'worker/index.ts']
    # The image's HEALTHCHECK probes port 3000, which the worker does not
    # serve — inheriting it would mark the scheduler unhealthy forever. Its
    # real health is the heartbeat, which /api/health reports and which goes
    # red after 20 minutes (SDD 10.4, improvement I-15).
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Exactly one. Two would double every escalation — the dedupe key makes that
    # safe, but the sweeper claims with SKIP LOCKED precisely so a second
    # instance is a scaling decision rather than an accident.
    deploy:
      replicas: 1

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # C collation: deterministic ordering regardless of the host's locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - jtas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persisted: the rate-limit counters may be lost, but BullMQ's queue state
    # should survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - jtas-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # quay.io, not Docker Hub: the docker.io/minio images sit behind a login.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - jtas-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-jtas-attachments};
      echo 'buckets ready';
      "
    restart: 'no'

  # Nightly pg_dump to S3, 30-day retention.
  #
  # No access keys. The container uses the EC2 instance role, which requires
  # the instance metadata hop limit to be 2 (docs/DEPLOY.md). An attachment
  # store outage must not take the database backups with it, so this does not
  # talk to MinIO.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: jtas-backup:${JTAS_VERSION:-latest}
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-jtas-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-19:30} # 01:00 IST
    depends_on:
      db:
        condition: service_healthy

volumes:
  jtas-db-data:
  jtas-redis-data:
  jtas-minio-data:
  jtas-caddy-data:
  jtas-caddy-config:
  jtas-caddy-logs:
