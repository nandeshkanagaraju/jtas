name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jtas
          POSTGRES_PASSWORD: jtas
          POSTGRES_DB: jtas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jtas -d jtas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jtas:jtas@localhost:5432/jtas_test?schema=public
      REDIS_URL: redis://localhost:6379
      # CI-only throwaway secrets; production values come from the host.
      JWT_SECRET: ci-access-secret-that-is-at-least-32-characters-long
      REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      APP_BASE_URL: http://localhost:3000
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
